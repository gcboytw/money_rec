<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketLedger - 極速記帳</title>
  
  <!-- iOS PWA Meta Tags & App Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="極速記帳">
  <meta name="theme-color" content="#18181b">
  <link rel="apple-touch-icon" href="asset/index-icon.png">
  <link rel="icon" type="image/png" href="asset/index-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 本地套件 (Vendor Libs) -->
  <script src="lib/dexie.min.js"></script>
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/lucide.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#09090b',
              card: '#18181b',
              subcard: '#27272a',
              border: '#3f3f46',
              accent: '#f59e0b',
              green: '#10b981',
              red: '#ef4444',
              blue: '#3b82f6'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#09090b] text-zinc-100 h-full flex flex-col font-sans antialiased overflow-hidden">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <!-- App Main Frame -->
  <div class="flex-1 flex flex-col max-w-md w-full mx-auto h-full shadow-2xl relative overflow-hidden bg-[#0c0c0e] border-x border-zinc-800/40">
    
    <!-- 1. Top Header & Week Strip Calendar -->
    <header class="pt-[max(env(safe-area-inset-top),10px)] px-3.5 pb-2 bg-[#121215] border-b border-zinc-800/80 shadow-md">
      <!-- 1.1 Top Row: Today Button | Month/Year Title | Calendar Picker -->
      <div class="flex items-center justify-between mb-2">
        <!-- Left: Today Shortcut Capsule Button -->
        <button onclick="goToToday()" class="tap-scale flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-blue-950/80 hover:bg-blue-900 border border-blue-600/50 shadow-sm text-blue-300">
          <span class="text-sm">🌙</span>
          <span class="text-xs font-bold tracking-tight">今天</span>
        </button>

        <!-- Center: Year & Month Title -->
        <div class="flex items-center gap-1.5 cursor-pointer select-none" onclick="document.getElementById('input-date-picker').showPicker?.() || document.getElementById('input-date-picker').click()">
          <h2 id="calendar-header-title" class="text-base font-extrabold tracking-wide text-zinc-100 font-sans">
            2026年 9月
          </h2>
        </div>

        <!-- Right: Calendar Picker Button -->
        <div class="relative">
          <button class="tap-scale p-2 rounded-xl bg-zinc-800/90 hover:bg-zinc-700/80 border border-zinc-700/60 text-zinc-300 flex items-center justify-center shadow-sm">
            <i data-lucide="calendar" class="w-4 h-4 text-amber-400"></i>
          </button>
          <input type="date" id="input-date-picker" onchange="onDatePickerChanged(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
        </div>
      </div>

      <!-- 1.2 Week Strip (7 Days: 週一 ~ 週日) -->
      <div id="week-strip-container" class="grid grid-cols-7 gap-0.5 sm:gap-1 text-center py-1">
        <!-- Dynamically rendered: 7 day buttons -->
      </div>
    </header>

    <!-- 2. Quick Entry Card (Placed Right Above Transaction List) -->
    <section class="p-3 bg-[#141418] border-b border-zinc-800/90 shadow-md">
      <!-- 2.1 Segmented Control (Expense / Income / Transfer) -->
      <div class="bg-zinc-900/90 p-1 rounded-xl flex items-center shadow-inner border border-zinc-800 mb-2.5">
        <button id="tab-expense" onclick="switchType('expense')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all bg-amber-500 text-zinc-950 shadow-md">
          支出
        </button>
        <button id="tab-income" onclick="switchType('income')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all text-zinc-400 hover:text-zinc-200">
          收入
        </button>
        <button id="tab-transfer" onclick="switchType('transfer')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all text-zinc-400 hover:text-zinc-200">
          轉帳
        </button>
      </div>

      <!-- 2.2 Account & Category Selectors (Standard Mode) -->
      <div id="selector-row-standard" class="grid grid-cols-3 gap-1.5 sm:gap-2 mb-2">
        <!-- Account Button -->
        <button onclick="openAccountModal('source')" class="tap-scale flex items-center justify-between px-2 py-1.5 sm:px-2.5 sm:py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="selected-account-icon" src="asset/account-dollar.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-xs text-zinc-400 leading-none">付款帳戶</div>
              <div id="selected-account-name" class="text-sm font-semibold text-zinc-200 truncate mt-0.5">現金</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <!-- Parent Category Button -->
        <button onclick="openCategoryModal()" class="tap-scale flex items-center justify-between px-2 py-1.5 sm:px-2.5 sm:py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="selected-category-icon" src="asset/categories-food.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-xs text-zinc-400 leading-none">主分類</div>
              <div id="selected-category-name" class="text-sm font-semibold text-zinc-200 truncate mt-0.5">食物酒水</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <!-- SubCategory Button -->
        <button onclick="openSubCategoryModal()" class="tap-scale flex items-center justify-between px-2 py-1.5 sm:px-2.5 sm:py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <div class="w-4 h-4 rounded-full bg-zinc-800 flex items-center justify-center flex-shrink-0">
              <img id="selected-subcategory-icon" src="asset/categories-food.svg" class="w-3 h-3 object-contain" alt="">
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-xs text-zinc-400 leading-none">子分類</div>
              <div id="selected-subcategory-name" class="text-sm font-semibold text-zinc-400 truncate mt-0.5">無 (選填)</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>
      </div>


      <!-- 2.2 Transfer Mode Row (Hidden in standard mode) -->
      <div id="selector-row-transfer" class="hidden grid-cols-5 gap-2 items-center mb-2.5">
        <!-- From Account -->
        <button onclick="openAccountModal('source')" class="tap-scale col-span-2 flex items-center justify-between px-2 py-1.5 sm:px-2.5 sm:py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="transfer-source-icon" src="asset/account-dollar.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-xs text-zinc-400 leading-none">轉出帳戶</div>
              <div id="transfer-source-name" class="text-sm font-semibold text-zinc-200 truncate mt-0.5">現金</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <div class="col-span-1 flex justify-center">
          <div class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-blue-400 shadow">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </div>
        </div>

        <!-- Target Account -->
        <button onclick="openAccountModal('target')" class="tap-scale col-span-2 flex items-center justify-between px-2 py-1.5 sm:px-2.5 sm:py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="transfer-target-icon" src="asset/account-bank.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-xs text-zinc-400 leading-none">轉入帳戶</div>
              <div id="transfer-target-name" class="text-sm font-semibold text-zinc-200 truncate mt-0.5">中國信託</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>
      </div>

      <!-- 2.3 Amount & Calculator Trigger & Note -->
      <div class="flex items-center gap-2">
        <!-- Amount Click Area (Opens Calculator) -->
        <div onclick="openCalculatorSheet()" class="tap-scale flex-1 flex items-center justify-between px-3 py-2 bg-zinc-900/90 rounded-xl border border-zinc-700/70 cursor-pointer shadow-inner hover:border-zinc-600 transition-colors">
          <div class="flex items-center gap-1.5">
            <span id="card-type-symbol" class="text-amber-400 font-bold text-xs">NT$</span>
            <span id="card-display-amount" class="text-xl sm:text-2xl font-black font-mono tracking-tight text-amber-400 truncate">0</span>
          </div>
          <div class="p-1 rounded-lg bg-zinc-800/90 text-amber-400 border border-zinc-700/50 flex items-center justify-center">
            <i data-lucide="calculator" class="w-4 h-4"></i>
          </div>
        </div>

        <!-- Note Input -->
        <div class="w-28 sm:w-36 flex items-center px-2.5 py-2 bg-zinc-900/90 rounded-xl border border-zinc-700/70 shadow-inner">
          <i data-lucide="edit-3" class="w-3.5 h-3.5 text-zinc-500 mr-1.5 flex-shrink-0"></i>
          <input type="text" id="input-note" placeholder="備註..." class="bg-transparent text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none w-full truncate">
        </div>

        <!-- Quick Submit Button -->
        <button id="btn-quick-submit" onclick="submitTransaction()" class="tap-scale px-3 sm:px-3.5 py-2 sm:py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold text-sm flex items-center gap-1 shadow-lg shadow-amber-500/20 flex-shrink-0">
          <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
          <span>記帳</span>
        </button>
      </div>
    </section>

    <!-- 3. Expanded Transaction History Section -->
    <main class="flex-1 overflow-y-auto px-3.5 py-3 space-y-2">
      <!-- Date Summary Header -->
      <div class="flex items-center justify-between px-1 mb-1">
        <div class="flex items-center gap-1.5">
          <i data-lucide="receipt" class="w-3.5 h-3.5 text-zinc-400"></i>
          <span id="list-date-label" class="text-xs font-bold tracking-wider text-zinc-200 uppercase">本日明細</span>
        </div>
        <div id="today-total-summary" class="text-xs text-zinc-400 font-mono font-medium">
          支出: NT$ 0 | 收入: NT$ 0
        </div>
      </div>

      <!-- Transaction List Items -->
      <div id="today-records-list" class="space-y-2 pb-6">
        <!-- Dynamically rendered -->
      </div>
    </main>

    <!-- 4. Bottom Navigation & Action Bar -->
    <nav class="glass-bar border-t border-zinc-800 px-2 sm:px-3 pt-1.5 pb-[max(env(safe-area-inset-bottom),10px)] select-none">
      <div class="grid grid-cols-5 gap-0.5 text-center">
        <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center justify-center py-1 text-amber-400">
          <i data-lucide="plus-circle" class="w-5 h-5 mb-0.5"></i>
          <span class="text-xs font-semibold">記帳</span>
        </button>

        <button onclick="openReportsModal()" id="nav-report" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i>
          <span class="text-xs font-semibold">報表</span>
        </button>

        <button onclick="openAccountManageModal()" id="nav-account" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>
          <span class="text-xs font-semibold">帳戶</span>
        </button>

        <button onclick="openCategoryManageModal()" id="nav-category" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="grid" class="w-5 h-5 mb-0.5"></i>
          <span class="text-xs font-semibold">分類</span>
        </button>

        <button onclick="openBackupModal()" id="nav-backup" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="download-cloud" class="w-5 h-5 mb-0.5"></i>
          <span class="text-xs font-semibold">備份</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- ================= MODALS & SHEETS ================= -->

  <!-- Modal 1: Bottom Sheet Calculator -->
  <div id="calc-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm transition-opacity">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),16px)] shadow-2xl flex flex-col">
      <!-- Calculator Display Header -->
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <div class="flex items-center gap-2">
          <div class="p-1.5 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/40">
            <i data-lucide="calculator" class="w-4 h-4"></i>
          </div>
          <span class="text-xs font-bold text-zinc-200">數字計算機</span>
        </div>
        <button onclick="closeCalculatorSheet()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Formula & Big Display -->
      <div class="my-3 px-3 py-2.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-right">
        <div id="calc-modal-formula" class="text-xs font-mono text-zinc-400 min-h-[16px] truncate"></div>
        <div id="calc-modal-amount" class="text-3xl font-extrabold font-mono text-amber-400 tracking-tight mt-0.5">0</div>
      </div>

      <!-- Keypad Grid -->
      <div class="grid grid-cols-4 gap-1.5 select-none">
        <button onclick="keypadInput('7')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">7</button>
        <button onclick="keypadInput('8')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">8</button>
        <button onclick="keypadInput('9')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">9</button>
        <button onclick="keypadInput('/')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">÷</button>

        <button onclick="keypadInput('4')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">4</button>
        <button onclick="keypadInput('5')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">5</button>
        <button onclick="keypadInput('6')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">6</button>
        <button onclick="keypadInput('*')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">×</button>

        <button onclick="keypadInput('1')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">1</button>
        <button onclick="keypadInput('2')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">2</button>
        <button onclick="keypadInput('3')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">3</button>
        <button onclick="keypadInput('-')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">−</button>

        <button onclick="keypadClear()" class="key-btn h-11 rounded-xl bg-red-950/40 text-red-400 border border-red-900/40 font-bold text-sm">C</button>
        <button onclick="keypadInput('0')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 shadow">0</button>
        <button onclick="keypadInput('.')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 shadow">.</button>
        <button onclick="keypadInput('+')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">+</button>

        <button onclick="keypadBackspace()" class="key-btn col-span-1 h-11 rounded-xl bg-zinc-700/80 text-zinc-300 font-semibold text-sm flex items-center justify-center shadow">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
        <button onclick="confirmCalculatorAmount()" class="key-btn col-span-3 h-11 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold text-base flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20">
          <i data-lucide="check" class="w-5 h-5 stroke-[2.5]"></i>
          <span>帶入金額</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Category Selection Sheet -->
  <div id="category-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="grid" class="w-4 h-4 text-amber-400"></i>
          選擇主分類
        </h3>
        <button onclick="closeCategoryModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-category-grid" class="grid grid-cols-4 gap-2.5 py-4 overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 3: SubCategory Selection Sheet -->
  <div id="subcategory-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[70vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="tag" class="w-4 h-4 text-amber-400"></i>
          選擇子分類 (<span id="modal-subcat-parent-name" class="text-amber-400"></span>)
        </h3>
        <button onclick="closeSubCategoryModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-subcategory-list" class="py-4 overflow-y-auto space-y-2">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 4: Account Selection Sheet -->
  <div id="account-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 id="modal-account-title" class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="wallet" class="w-4 h-4 text-amber-400"></i>
          選擇帳戶
        </h3>
        <button onclick="closeAccountModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-account-list" class="overflow-y-auto py-3 space-y-4 flex-1">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 5: Account Management Full Modal -->
  <div id="account-manage-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="wallet" class="w-5 h-5 text-amber-400"></i>
          帳戶管理與餘額
        </h3>
        <div class="flex items-center gap-2">
          <button onclick="openNewAccountForm()" class="px-2.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold flex items-center gap-1 shadow">
            <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
            <span>新增帳戶</span>
          </button>
          <button onclick="closeAccountManageModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div id="manage-account-list" class="overflow-y-auto py-3 space-y-3 flex-1"></div>
    </div>
  </div>

  <!-- Modal 6: Category Management Full Modal -->
  <div id="category-manage-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="grid" class="w-5 h-5 text-amber-400"></i>
          分類與子分類管理
        </h3>
        <div class="flex items-center gap-2">
          <button onclick="openNewCategoryForm()" class="px-2.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold flex items-center gap-1 shadow">
            <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
            <span>新增分類</span>
          </button>
          <button onclick="closeCategoryManageModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2 my-2.5 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
        <button id="cat-manage-tab-exp" onclick="switchCategoryManageType('expense')" class="flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950">
          支出分類
        </button>
        <button id="cat-manage-tab-inc" onclick="switchCategoryManageType('income')" class="flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400">
          收入分類
        </button>
      </div>

      <div id="manage-category-list" class="overflow-y-auto py-2 space-y-3 flex-1"></div>
    </div>
  </div>

  <!-- Modal 7: Add/Edit Account Form Sheet (z-[70] to guarantee overlay above manage modal) -->
  <div id="account-form-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div onclick="event.stopPropagation()" class="bg-[#18181b] border border-zinc-700/80 rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3.5 modal-enter">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
        <h4 id="form-account-title" class="text-sm font-bold text-zinc-100">新增帳戶</h4>
        <button onclick="closeAccountFormModal()" class="text-zinc-400 hover:text-zinc-200"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <input type="hidden" id="form-account-id" value="">
      <div class="space-y-2.5">
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">帳戶群組</label>
          <select id="form-account-group" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none">
            <option value="現金">現金</option>
            <option value="銀行">銀行</option>
            <option value="信用卡">信用卡</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">帳戶名稱</label>
          <input type="text" id="form-account-name" placeholder="例如：台新 Richart" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-semibold text-zinc-400 block">初始餘額 (NT$)</label>
            <span class="text-xs text-amber-400/80 font-mono">可隨時修改初始本金</span>
          </div>
          <input type="number" id="form-account-balance" placeholder="0" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm font-mono text-zinc-200 focus:outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">選擇圖示</label>
          <div class="flex gap-2" id="form-account-icons">
            <label class="flex items-center gap-1.5 p-2 bg-zinc-900 rounded-xl border border-zinc-700 cursor-pointer text-xs">
              <input type="radio" name="acc-icon" value="asset/account-dollar.svg" checked>
              <img src="asset/account-dollar.svg" class="w-4 h-4">
            </label>
            <label class="flex items-center gap-1.5 p-2 bg-zinc-900 rounded-xl border border-zinc-700 cursor-pointer text-xs">
              <input type="radio" name="acc-icon" value="asset/account-bank.svg">
              <img src="asset/account-bank.svg" class="w-4 h-4">
            </label>
            <label class="flex items-center gap-1.5 p-2 bg-zinc-900 rounded-xl border border-zinc-700 cursor-pointer text-xs">
              <input type="radio" name="acc-icon" value="asset/account-creditcard.svg">
              <img src="asset/account-creditcard.svg" class="w-4 h-4">
            </label>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeAccountFormModal()" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-300">取消</button>
        <button onclick="saveAccountForm()" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-500 text-zinc-950 shadow">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal 8: Add/Edit Category Form Sheet (z-[70]) -->
  <div id="category-form-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div onclick="event.stopPropagation()" class="bg-[#18181b] border border-zinc-700/80 rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3.5 modal-enter">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
        <h4 id="category-form-title" class="text-sm font-bold text-zinc-100">新增分類</h4>
        <button onclick="closeCategoryFormModal()" class="text-zinc-400 hover:text-zinc-200"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <input type="hidden" id="form-cat-id" value="">

      <!-- Category Level Switcher (Main vs Sub) -->
      <div id="form-cat-level-row" class="bg-zinc-900 p-1 rounded-xl flex items-center border border-zinc-800">
        <button type="button" id="form-level-parent" onclick="switchCategoryFormLevel('parent')" class="flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950">
          主分類
        </button>
        <button type="button" id="form-level-sub" onclick="switchCategoryFormLevel('sub')" class="flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400">
          子分類
        </button>
      </div>

      <div class="space-y-2.5">
        <!-- Parent Category Selector (Shown only when creating/editing a subcategory) -->
        <div id="form-cat-parent-select-wrap" class="hidden">
          <label class="text-xs font-semibold text-zinc-400 block mb-1">所屬主分類</label>
          <select id="form-cat-parent-id" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none"></select>
        </div>

        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">分類名稱</label>
          <input type="text" id="form-cat-name" placeholder="例如：早餐 / 裝備" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">選擇圖示</label>
          <div id="form-cat-icon-grid" class="grid grid-cols-6 gap-2 max-h-36 overflow-y-auto p-1 bg-zinc-900 rounded-xl border border-zinc-800"></div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeCategoryFormModal()" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-300">取消</button>
        <button onclick="saveCategoryForm()" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-500 text-zinc-950 shadow">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal 9: Edit Transaction Modal (流水帳項目修改, z-[70]) -->
  <div id="edit-record-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div onclick="event.stopPropagation()" class="bg-[#18181b] border border-zinc-700/80 rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-3.5 modal-enter">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2.5">
        <h4 class="text-sm font-bold text-zinc-100 flex items-center gap-1.5">
          <i data-lucide="edit-2" class="w-4 h-4 text-amber-400"></i>
          編輯流水帳明細
        </h4>
        <button onclick="closeEditRecordModal()" class="text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <input type="hidden" id="edit-record-id" value="">
      
      <!-- Type Switcher in Edit Modal -->
      <div class="bg-zinc-900 p-1 rounded-xl flex items-center border border-zinc-800">
        <button id="edit-tab-expense" onclick="switchEditRecordType('expense')" class="flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950">
          支出
        </button>
        <button id="edit-tab-income" onclick="switchEditRecordType('income')" class="flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400">
          收入
        </button>
        <button id="edit-tab-transfer" onclick="switchEditRecordType('transfer')" class="flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400">
          轉帳
        </button>
      </div>

      <div class="space-y-2.5">
        <!-- Amount -->
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">金額 (NT$)</label>
          <input type="number" id="edit-record-amount" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-base font-mono font-bold text-amber-400 focus:outline-none" placeholder="0">
        </div>

        <!-- Date -->
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">交易日期</label>
          <input type="date" id="edit-record-date" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none">
        </div>

        <!-- Standard Fields: Account + ParentCategory + SubCategory -->
        <div id="edit-fields-standard" class="space-y-2.5">
          <div>
            <label class="text-xs font-semibold text-zinc-400 block mb-1">帳戶</label>
            <select id="edit-record-account" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-zinc-400 block mb-1">主分類</label>
              <select id="edit-record-parent-cat" onchange="onEditParentCatChanged(this.value)" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-2.5 py-2 text-sm text-zinc-200 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-xs font-semibold text-zinc-400 block mb-1">子分類</label>
              <select id="edit-record-sub-cat" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-2.5 py-2 text-sm text-zinc-200 focus:outline-none"></select>
            </div>
          </div>
        </div>

        <!-- Transfer Fields: From Account + To Account -->
        <div id="edit-fields-transfer" class="hidden space-y-2.5">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-zinc-400 block mb-1">轉出帳戶</label>
              <select id="edit-record-from-account" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-2.5 py-2 text-sm text-zinc-200 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-xs font-semibold text-zinc-400 block mb-1">轉入帳戶</label>
              <select id="edit-record-to-account" class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-2.5 py-2 text-sm text-zinc-200 focus:outline-none"></select>
            </div>
          </div>
        </div>

        <!-- Note -->
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">備註</label>
          <input type="text" id="edit-record-note" placeholder="可填寫備註..." class="w-full bg-zinc-900 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeEditRecordModal()" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-300">取消</button>
        <button onclick="saveEditRecord()" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-500 text-zinc-950 shadow">儲存修改</button>
      </div>
    </div>
  </div>

  <!-- Modal 10: Reports & Statistics Modal -->
  <div id="reports-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-5 h-5 text-amber-400"></i>
          收支統計報表
        </h3>
        <button onclick="closeReportsModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="overflow-y-auto py-3 space-y-4 flex-1">
        <div class="grid grid-cols-3 gap-2 text-center p-3 rounded-2xl bg-zinc-900 border border-zinc-800">
          <div>
            <div class="text-xs text-zinc-400">本月支出</div>
            <div id="stat-month-expense" class="text-sm sm:text-base font-bold font-mono text-amber-400 mt-0.5">NT$ 0</div>
          </div>
          <div>
            <div class="text-xs text-zinc-400">本月收入</div>
            <div id="stat-month-income" class="text-sm sm:text-base font-bold font-mono text-emerald-400 mt-0.5">NT$ 0</div>
          </div>
          <div>
            <div class="text-xs text-zinc-400">結餘</div>
            <div id="stat-month-balance" class="text-sm sm:text-base font-bold font-mono text-zinc-200 mt-0.5">NT$ 0</div>
          </div>
        </div>

        <div class="p-3 rounded-2xl bg-zinc-900/60 border border-zinc-800 text-center">
          <div class="text-xs font-bold text-zinc-300 mb-2">支出分類圓餅圖</div>
          <div class="h-48 relative flex items-center justify-center">
            <canvas id="categoryExpenseChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 11: Backup & Export Modal -->
  <div id="backup-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="download-cloud" class="w-5 h-5 text-amber-400"></i>
          資料備份與匯出
        </h3>
        <button onclick="closeBackupModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="py-4 space-y-3 overflow-y-auto">
        <div class="p-3 bg-zinc-900 rounded-2xl border border-zinc-800 flex items-center justify-between">
          <div>
            <div class="text-sm font-bold text-zinc-200">匯出 JSON 完整資料庫</div>
            <div class="text-xs text-zinc-400">包含所有帳戶、分類與記帳歷史</div>
          </div>
          <button onclick="exportJSONBackup()" class="px-3 py-1.5 rounded-xl bg-amber-500 text-zinc-950 font-bold text-xs">匯出</button>
        </div>

        <div class="p-3 bg-zinc-900 rounded-2xl border border-zinc-800 flex items-center justify-between">
          <div>
            <div class="text-sm font-bold text-zinc-200">還原 JSON 備份檔</div>
            <div class="text-xs text-zinc-400">選擇備份檔並匯入資料庫</div>
          </div>
          <label class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold text-xs cursor-pointer border border-zinc-700">
            選擇檔案
            <input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden">
          </label>
        </div>

        <div class="p-3 bg-zinc-900 rounded-2xl border border-zinc-800 flex items-center justify-between">
          <div>
            <div class="text-sm font-bold text-zinc-200">檢查與更新版本</div>
            <div class="text-xs text-zinc-400">清除舊快取並重新載入最新 App</div>
          </div>
          <button onclick="forceUpdateApp()" class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-bold text-xs border border-zinc-700">更新</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal (z-[80]) -->
  <div id="confirm-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div onclick="event.stopPropagation()" class="bg-[#18181b] border border-zinc-700/80 rounded-2xl p-5 max-w-xs w-full shadow-2xl space-y-3 modal-enter">
      <div class="flex items-center gap-2 text-red-400 font-bold text-base">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        確認刪除
      </div>
      <p id="confirm-modal-msg" class="text-xs text-zinc-300">確定要刪除這筆資料嗎？此動作無法復原。</p>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeConfirmModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-800 text-zinc-300">取消</button>
        <button id="btn-confirm-delete" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-600/30">確定刪除</button>
      </div>
    </div>
  </div>

  <!-- 核心資料庫與邏輯腳本 -->
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
