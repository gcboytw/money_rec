<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketLedger - 極速記帳</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="極速記帳">
  <meta name="theme-color" content="#18181b">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 本地套件 (Vendor Libs) -->
  <script src="lib/dexie.min.js"></script>
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/lucide.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#09090b',
              card: '#18181b',
              subcard: '#27272a',
              border: '#3f3f46',
              accent: '#f59e0b',
              green: '#10b981',
              red: '#ef4444',
              blue: '#3b82f6'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#09090b] text-zinc-100 h-full flex flex-col font-sans antialiased overflow-hidden">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <!-- App Main Frame -->
  <div class="flex-1 flex flex-col max-w-md w-full mx-auto h-full shadow-2xl relative overflow-hidden bg-[#0c0c0e] border-x border-zinc-800/40">
    
    <!-- 1. Top Header & Week Strip Calendar -->
    <header class="pt-[max(env(safe-area-inset-top),10px)] px-3.5 pb-2 bg-[#121215] border-b border-zinc-800/80 shadow-md">
      <!-- 1.1 Top Row: Today Button | Month/Year Title | Calendar Picker -->
      <div class="flex items-center justify-between mb-2">
        <!-- Left: Today Shortcut Capsule Button -->
        <button onclick="goToToday()" class="tap-scale flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-blue-950/80 hover:bg-blue-900 border border-blue-600/50 shadow-sm text-blue-300">
          <span class="text-sm">🌙</span>
          <span class="text-xs font-bold tracking-tight">今天</span>
        </button>

        <!-- Center: Year & Month Title -->
        <div class="flex items-center gap-1.5 cursor-pointer select-none" onclick="document.getElementById('input-date-picker').showPicker?.() || document.getElementById('input-date-picker').click()">
          <h2 id="calendar-header-title" class="text-base font-extrabold tracking-wide text-zinc-100 font-sans">
            2026年 9月
          </h2>
        </div>

        <!-- Right: Calendar Picker Button -->
        <div class="relative">
          <button class="tap-scale p-2 rounded-xl bg-zinc-800/90 hover:bg-zinc-700/80 border border-zinc-700/60 text-zinc-300 flex items-center justify-center shadow-sm">
            <i data-lucide="calendar" class="w-4 h-4 text-amber-400"></i>
          </button>
          <input type="date" id="input-date-picker" onchange="onDatePickerChanged(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
        </div>
      </div>

      <!-- 1.2 Week Strip (7 Days: 週一 ~ 週日) -->
      <div id="week-strip-container" class="grid grid-cols-7 gap-1 text-center py-1">
        <!-- Dynamically rendered: 7 day buttons -->
      </div>
    </header>

    <!-- 2. Quick Entry Card (Placed Right Above Transaction List) -->
    <section class="p-3 bg-[#141418] border-b border-zinc-800/90 shadow-md">
      <!-- 2.1 Segmented Control (Expense / Income / Transfer) -->
      <div class="bg-zinc-900/90 p-1 rounded-xl flex items-center shadow-inner border border-zinc-800 mb-2.5">
        <button id="tab-expense" onclick="switchType('expense')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all bg-amber-500 text-zinc-950 shadow-md">
          支出
        </button>
        <button id="tab-income" onclick="switchType('income')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all text-zinc-400 hover:text-zinc-200">
          收入
        </button>
        <button id="tab-transfer" onclick="switchType('transfer')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all text-zinc-400 hover:text-zinc-200">
          轉帳
        </button>
      </div>

      <!-- 2.2 Account & Category Selectors (Standard Mode) -->
      <div id="selector-row-standard" class="grid grid-cols-3 gap-2 mb-2">
        <!-- Account Button -->
        <button onclick="openAccountModal('source')" class="tap-scale flex items-center justify-between px-2.5 py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="selected-account-icon" src="asset/account-dollar.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-[9px] text-zinc-500 leading-none">付款帳戶</div>
              <div id="selected-account-name" class="text-xs font-semibold text-zinc-200 truncate mt-0.5">現金</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <!-- Parent Category Button -->
        <button onclick="openCategoryModal()" class="tap-scale flex items-center justify-between px-2.5 py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="selected-category-icon" src="asset/categories-food.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-[9px] text-zinc-500 leading-none">主分類</div>
              <div id="selected-category-name" class="text-xs font-semibold text-zinc-200 truncate mt-0.5">食物酒水</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <!-- SubCategory Button -->
        <button onclick="openSubCategoryModal()" class="tap-scale flex items-center justify-between px-2.5 py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0 shadow-sm">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <div class="w-4 h-4 rounded-full bg-zinc-800 flex items-center justify-center flex-shrink-0">
              <img id="selected-subcategory-icon" src="asset/categories-food.svg" class="w-3 h-3 object-contain" alt="">
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[9px] text-zinc-500 leading-none">子分類</div>
              <div id="selected-subcategory-name" class="text-xs font-semibold text-zinc-400 truncate mt-0.5">無 (選填)</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>
      </div>

      <!-- 2.2.1 SubCategory Quick Horizontal Bar (Auto expands if subcategories exist) -->
      <div id="quick-subcategory-container" class="mb-2.5 overflow-x-auto no-scrollbar flex items-center gap-1.5 py-1">
        <!-- Dynamically rendered subcategory pills -->
      </div>

      <!-- 2.2 Transfer Mode Row (Hidden in standard mode) -->
      <div id="selector-row-transfer" class="hidden grid-cols-5 gap-2 items-center mb-2.5">
        <!-- From Account -->
        <button onclick="openAccountModal('source')" class="tap-scale col-span-2 flex items-center justify-between px-2.5 py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="transfer-source-icon" src="asset/account-dollar.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-[9px] text-zinc-500 leading-none">轉出帳戶</div>
              <div id="transfer-source-name" class="text-xs font-semibold text-zinc-200 truncate mt-0.5">現金</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>

        <div class="col-span-1 flex justify-center">
          <div class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-blue-400 shadow">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </div>
        </div>

        <!-- Target Account -->
        <button onclick="openAccountModal('target')" class="tap-scale col-span-2 flex items-center justify-between px-2.5 py-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800/80 border border-zinc-700/60 text-left min-w-0">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <img id="transfer-target-icon" src="asset/account-bank.svg" class="w-4 h-4 object-contain flex-shrink-0" alt="">
            <div class="min-w-0 flex-1">
              <div class="text-[9px] text-zinc-500 leading-none">轉入帳戶</div>
              <div id="transfer-target-name" class="text-xs font-semibold text-zinc-200 truncate mt-0.5">中國信託</div>
            </div>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0 ml-1"></i>
        </button>
      </div>

      <!-- 2.3 Amount & Calculator Trigger & Note -->
      <div class="flex items-center gap-2">
        <!-- Amount Click Area (Opens Calculator) -->
        <div onclick="openCalculatorSheet()" class="tap-scale flex-1 flex items-center justify-between px-3 py-2 bg-zinc-900/90 rounded-xl border border-zinc-700/70 cursor-pointer shadow-inner hover:border-zinc-600 transition-colors">
          <div class="flex items-center gap-1.5">
            <span id="card-type-symbol" class="text-amber-400 font-bold text-xs">NT$</span>
            <span id="card-display-amount" class="text-xl sm:text-2xl font-black font-mono tracking-tight text-amber-400 truncate">0</span>
          </div>
          <div class="p-1 rounded-lg bg-zinc-800/90 text-amber-400 border border-zinc-700/50 flex items-center justify-center">
            <i data-lucide="calculator" class="w-4 h-4"></i>
          </div>
        </div>

        <!-- Note Input -->
        <div class="w-32 sm:w-36 flex items-center px-2.5 py-2 bg-zinc-900/90 rounded-xl border border-zinc-700/70 shadow-inner">
          <i data-lucide="edit-3" class="w-3.5 h-3.5 text-zinc-500 mr-1.5 flex-shrink-0"></i>
          <input type="text" id="input-note" placeholder="備註..." class="bg-transparent text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none w-full truncate">
        </div>

        <!-- Quick Submit Button -->
        <button id="btn-quick-submit" onclick="submitTransaction()" class="tap-scale px-3.5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold text-xs flex items-center gap-1 shadow-lg shadow-amber-500/20">
          <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
          <span>記帳</span>
        </button>
      </div>
    </section>

    <!-- 3. Expanded Transaction History Section -->
    <main class="flex-1 overflow-y-auto px-3.5 py-3 space-y-2">
      <!-- Date Summary Header -->
      <div class="flex items-center justify-between px-1 mb-1">
        <div class="flex items-center gap-1.5">
          <i data-lucide="receipt" class="w-3.5 h-3.5 text-zinc-400"></i>
          <span id="list-date-label" class="text-xs font-bold tracking-wider text-zinc-200 uppercase">本日明細</span>
        </div>
        <div id="today-total-summary" class="text-[11px] text-zinc-400 font-mono font-medium">
          支出: NT$ 0 | 收入: NT$ 0
        </div>
      </div>

      <!-- Transaction List Items -->
      <div id="today-records-list" class="space-y-2 pb-6">
        <!-- Dynamically rendered -->
      </div>
    </main>

    <!-- 4. Bottom Navigation & Action Bar -->
    <nav class="glass-bar border-t border-zinc-800 px-3 pt-1.5 pb-[max(env(safe-area-inset-bottom),10px)] select-none">
      <div class="grid grid-cols-5 gap-1 text-center">
        <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center justify-center py-1 text-amber-400">
          <i data-lucide="plus-circle" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-semibold">記帳</span>
        </button>

        <button onclick="openReportsModal()" id="nav-report" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-semibold">報表</span>
        </button>

        <button onclick="openAccountManageModal()" id="nav-account" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-semibold">帳戶</span>
        </button>

        <button onclick="openCategoryManageModal()" id="nav-category" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="grid" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-semibold">分類</span>
        </button>

        <button onclick="openBackupModal()" id="nav-backup" class="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200">
          <i data-lucide="download-cloud" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-semibold">備份</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- ================= MODALS & SHEETS ================= -->

  <!-- Modal 1: Bottom Sheet Calculator -->
  <div id="calc-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm transition-opacity">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),16px)] shadow-2xl flex flex-col">
      <!-- Calculator Display Header -->
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <div class="flex items-center gap-2">
          <div class="p-1.5 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/40">
            <i data-lucide="calculator" class="w-4 h-4"></i>
          </div>
          <span class="text-xs font-bold text-zinc-200">數字計算機</span>
        </div>
        <button onclick="closeCalculatorSheet()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Formula & Big Display -->
      <div class="my-3 px-3 py-2.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-right">
        <div id="calc-modal-formula" class="text-xs font-mono text-zinc-400 min-h-[16px] truncate"></div>
        <div id="calc-modal-amount" class="text-3xl font-extrabold font-mono text-amber-400 tracking-tight mt-0.5">0</div>
      </div>

      <!-- Keypad Grid -->
      <div class="grid grid-cols-4 gap-1.5 select-none">
        <button onclick="keypadInput('7')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">7</button>
        <button onclick="keypadInput('8')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">8</button>
        <button onclick="keypadInput('9')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">9</button>
        <button onclick="keypadInput('/')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">÷</button>

        <button onclick="keypadInput('4')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">4</button>
        <button onclick="keypadInput('5')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">5</button>
        <button onclick="keypadInput('6')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">6</button>
        <button onclick="keypadInput('*')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">×</button>

        <button onclick="keypadInput('1')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">1</button>
        <button onclick="keypadInput('2')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">2</button>
        <button onclick="keypadInput('3')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 active:bg-zinc-600 shadow">3</button>
        <button onclick="keypadInput('-')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">−</button>

        <button onclick="keypadClear()" class="key-btn h-11 rounded-xl bg-red-950/40 text-red-400 border border-red-900/40 font-bold text-sm">C</button>
        <button onclick="keypadInput('0')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 shadow">0</button>
        <button onclick="keypadInput('.')" class="key-btn h-11 rounded-xl bg-zinc-800/90 text-zinc-100 font-semibold text-lg hover:bg-zinc-700 shadow">.</button>
        <button onclick="keypadInput('+')" class="key-btn h-11 rounded-xl bg-zinc-700/70 text-amber-400 font-bold text-lg hover:bg-zinc-600 shadow">+</button>

        <button onclick="keypadBackspace()" class="key-btn col-span-1 h-11 rounded-xl bg-zinc-700/80 text-zinc-300 font-semibold text-sm flex items-center justify-center shadow">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
        <button onclick="confirmCalculatorAmount()" class="key-btn col-span-3 h-11 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold text-base flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20">
          <i data-lucide="check" class="w-5 h-5 stroke-[2.5]"></i>
          <span>帶入金額</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Category Selection Sheet -->
  <div id="category-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="grid" class="w-4 h-4 text-amber-400"></i>
          選擇主分類
        </h3>
        <button onclick="closeCategoryModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-category-grid" class="grid grid-cols-4 gap-2.5 py-4 overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 3: SubCategory Selection Sheet -->
  <div id="subcategory-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[70vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="tag" class="w-4 h-4 text-amber-400"></i>
          選擇子分類 (<span id="modal-subcat-parent-name" class="text-amber-400"></span>)
        </h3>
        <button onclick="closeSubCategoryModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-subcategory-list" class="py-4 overflow-y-auto space-y-2">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 4: Account Selection Sheet -->
  <div id="account-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="modal-enter w-full max-w-md bg-[#16161a] rounded-t-3xl border-t border-zinc-700/80 p-4 pb-[max(env(safe-area-inset-bottom),20px)] shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 id="modal-account-title" class="text-sm font-bold text-zinc-100 flex items-center gap-2">
          <i data-lucide="wallet" class="w-4 h-4 text-amber-400"></i>
          選擇帳戶
        </h3>
        <button onclick="closeAccountModal()" class="p-1 rounded-full text-zinc-400 hover:text-zinc-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-account-list" class="overflow-y-auto py-3 space-y-4 flex-1">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Modal 5: Account Management Full Modal -->
  <div id="account-manage-modal" class="fixed inset-0 z-50 hidden flex items-end justify-center bg-black/60 backdrop-blur-sm">

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /**
     * Date & Week Helper Functions
     */
    function getWeekDaysForDate(dateStr) {
      const target = new Date(dateStr + 'T00:00:00');
      const dayOfWeek = target.getDay();
      const distToMonday = (dayOfWeek + 6) % 7;
      const monday = new Date(target);
      monday.setDate(target.getDate() - distToMonday);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dt = String(d.getDate()).padStart(2, '0');
        days.push({
          dateStr: `${y}-${m}-${dt}`,
          dayNum: d.getDate(),
          dayName: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'][i],
          month: d.getMonth() + 1,
          year: y
        });
      }
      return days;
    }

    /**
     * Initialize App
     */
    async function initApp() {
      try {
        await initDatabaseSeeds();
        await loadAllData();
        setupDefaultSelections();
        renderWeekStripCalendar();
        renderSubCategoryQuickPills();
        await renderTodayRecords();
        lucide.createIcons();
      } catch (err) {
        console.error('App init error:', err);
        showToast('初始化失敗', 'error');
      }
    }

    async function initDatabaseSeeds() {
      const catCount = await db.categories.count();
      if (catCount === 0) {
        for (const cat of SEED_DATA.categories) {
          const parentId = await db.categories.add({
            name: cat.name,
            type: cat.type,
            parentId: null,
            icon: cat.icon,
            color: cat.color || '#f59e0b',
            budgetMonthly: 0,
            isArchived: false
          });

          if (cat.children && cat.children.length > 0) {
            for (const child of cat.children) {
              await db.categories.add({
                name: child.name,
                type: cat.type,
                parentId: parentId,
                icon: child.icon,
                color: cat.color || '#f59e0b',
                budgetMonthly: 0,
                isArchived: false
              });
            }
          }
        }
      }

      const accCount = await db.accounts.count();
      if (accCount === 0) {
        for (const acc of SEED_DATA.accounts) {
          await db.accounts.add({
            name: acc.name,
            groupName: acc.groupName,
            icon: acc.icon,
            initialBalance: acc.initialBalance || 0,
            isDefault: !!acc.isDefault,
            isArchived: false
          });
        }
      }
    }

    async function loadAllData() {
      state.allCategories = await db.categories.toArray();
      state.allAccounts = await db.accounts.toArray();
    }

    function setupDefaultSelections() {
      const defAcc = state.allAccounts.find(a => a.isDefault && !a.isArchived) || state.allAccounts.find(a => !a.isArchived);
      if (defAcc) setSelectedAccount(defAcc);

      const targetAcc = state.allAccounts.find(a => a.id !== defAcc?.id && !a.isArchived) || state.allAccounts[1];
      if (targetAcc) setTransferTargetAccount(targetAcc);

      const expCats = state.allCategories.filter(c => c.type === 'expense' && c.parentId === null && !c.isArchived);
      if (expCats.length > 0) {
        setSelectedParentCategory(expCats[0]);
      }
    }

    /**
     * Week Strip Calendar Rendering
     */
    async function renderWeekStripCalendar() {
      const container = document.getElementById('week-strip-container');
      const titleEl = document.getElementById('calendar-header-title');
      const pickerInput = document.getElementById('input-date-picker');
      const todayStr = getTodayString();

      pickerInput.value = state.selectedDate;
      pickerInput.max = todayStr;

      const selectedD = new Date(state.selectedDate + 'T00:00:00');
      titleEl.textContent = `${selectedD.getFullYear()}年 ${selectedD.getMonth() + 1}月`;

      const listLabel = document.getElementById('list-date-label');
      if (state.selectedDate === todayStr) {
        listLabel.textContent = '本日明細';
      } else {
        listLabel.textContent = `${selectedD.getMonth() + 1}月${selectedD.getDate()}日 明細`;
      }

      const weekDays = getWeekDaysForDate(state.selectedDate);
      const startOfWeek = weekDays[0].dateStr;
      const endOfWeek = weekDays[6].dateStr;
      const weekRecords = await db.records.where('date').between(startOfWeek, endOfWeek, true, true).toArray();
      const recordDatesSet = new Set(weekRecords.map(r => r.date));

      container.innerHTML = weekDays.map(item => {
        const isSelected = item.dateStr === state.selectedDate;
        const isToday = item.dateStr === todayStr;
        const isFuture = item.dateStr > todayStr;
        const hasRecord = recordDatesSet.has(item.dateStr);

        const titleClass = isSelected ? 'text-zinc-100 font-extrabold' : 'text-zinc-400 font-bold';

        let numBoxClass = 'w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm mx-auto transition-all';
        if (isSelected) {
          numBoxClass += ' bg-amber-500 text-zinc-950 shadow-md shadow-amber-500/20 font-black scale-105';
        } else if (isToday) {
          numBoxClass += ' text-amber-400 font-extrabold';
        } else if (isFuture) {
          numBoxClass += ' text-zinc-600';
        } else {
          numBoxClass += ' text-zinc-300 hover:text-zinc-100';
        }

        let dotHtml = '<div class="w-1.5 h-1.5 mt-1 rounded-full mx-auto opacity-0"></div>';
        if (hasRecord) {
          dotHtml = `<div class="w-1.5 h-1.5 mt-1 rounded-full bg-amber-500 mx-auto shadow-sm"></div>`;
        }

        return `
          <button onclick="selectDate('${item.dateStr}')" class="tap-scale flex flex-col items-center py-1 rounded-xl transition-all ${isSelected ? 'bg-zinc-800/40' : 'hover:bg-zinc-800/20'}">
            <span class="text-[11px] mb-1.5 ${titleClass}">${item.dayName}</span>
            <div class="${numBoxClass}">${item.dayNum}</div>
            ${dotHtml}
          </button>
        `;
      }).join('');
    }

    async function selectDate(dateStr) {
      state.selectedDate = dateStr;
      await renderWeekStripCalendar();
      await renderTodayRecords();
    }

    async function goToToday() {
      const today = getTodayString();
      await selectDate(today);
      showToast('已切換至今天', 'info');
    }

    async function onDatePickerChanged(val) {
      if (!val) return;
      const today = getTodayString();
      if (val > today) {
        showToast('不允許選擇未來日期', 'error');
        document.getElementById('input-date-picker').value = state.selectedDate;
        return;
      }
      await selectDate(val);
    }

    /**
     * Category & SubCategory Quick Selection Bar
     */
    function renderSubCategoryQuickPills() {
      const container = document.getElementById('quick-subcategory-container');
      if (state.currentType === 'transfer' || !state.selectedParentCategory) {
        container.innerHTML = '';
        return;
      }

      const subCats = state.allCategories.filter(
        c => c.parentId === state.selectedParentCategory.id && !c.isArchived
      );

      if (subCats.length === 0) {
        container.innerHTML = '';
        return;
      }

      const isNoneSelected = !state.selectedSubCategory;
      let html = `
        <button onclick="pickSubCategory(null)" class="tap-scale flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition-all ${isNoneSelected ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
          全部 / 無
        </button>
      `;

      for (const sub of subCats) {
        const isSelected = state.selectedSubCategory && state.selectedSubCategory.id === sub.id;
        html += `
          <button onclick="pickSubCategory(${sub.id})" class="tap-scale flex-shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition-all ${isSelected ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
            <img src="${sub.icon}" class="w-3.5 h-3.5 object-contain">
            <span>${sub.name}</span>
          </button>
        `;
      }

      container.innerHTML = html;
    }

      state.selectedParentCategory = cat;
      state.selectedSubCategory = null;
      document.getElementById('selected-category-name').textContent = cat.name;
      document.getElementById('selected-category-icon').src = cat.icon;
      
      document.getElementById('selected-subcategory-name').textContent = '無 (選填)';
      document.getElementById('selected-subcategory-icon').src = cat.icon;

      renderSubCategoryQuickPills();

      if (subCat) {
        document.getElementById('selected-subcategory-name').textContent = subCat.name;

        showToast('請先選取主分類', 'info');

      document.getElementById('modal-subcat-parent-name').textContent = state.selectedParentCategory.name;

      const subCats = state.allCategories.filter(
        c => c.parentId === state.selectedParentCategory.id && !c.isArchived

      lucide.createIcons();

     */
    function openCalculatorSheet() {

    function closeCalculatorSheet() {
      document.getElementById('calc-modal').classList.add('hidden');

    function keypadInput(val) {
      const current = state.calcExpression;
      const ops = ['+', '-', '*', '/'];

      if (current === '0' && !ops.includes(val) && val !== '.') {
        state.calcExpression = val;
      } else {
        const lastChar = current.slice(-1);
        if (ops.includes(lastChar) && ops.includes(val)) {
          state.calcExpression = current.slice(0, -1) + val;
        } else if (val === '.') {
          const segments = current.split(/[\+\-\*\/]/);
          const lastSeg = segments[segments.length - 1];
          if (!lastSeg.includes('.')) {
            state.calcExpression += val;
          }
        } else {
          if (state.calcExpression.length < 24) {
            state.calcExpression += val;
          }
        }
      }
      updateCalculatorSheetDisplay();
    }

    function keypadClear() {
      state.calcExpression = '0';
      updateCalculatorSheetDisplay();
    }

    function keypadBackspace() {
      if (state.calcExpression.length > 1) {
        state.calcExpression = state.calcExpression.slice(0, -1);
      } else {
        state.calcExpression = '0';
      }
      updateCalculatorSheetDisplay();
    }

    function evaluateExpression(expr) {
      try {
        let sanitized = String(expr).replace(/[^0-9\+\-\*\/\.]/g, '');
        while (['+', '-', '*', '/'].includes(sanitized.slice(-1))) {
          sanitized = sanitized.slice(0, -1);
        }
        if (!sanitized) return 0;
        const result = Function(`'use strict'; return (${sanitized})`)();
        if (isNaN(result) || !isFinite(result)) return 0;
        return Math.round(result * 100) / 100;
      } catch (e) {
        return 0;
      }
    }

    function updateCalculatorSheetDisplay() {
      const expr = state.calcExpression;
      const formulaEl = document.getElementById('calc-modal-formula');
      const amountEl = document.getElementById('calc-modal-amount');
      const ops = ['+', '-', '*', '/'];

      const hasOp = ops.some(op => expr.includes(op));
      const evalVal = evaluateExpression(expr);

      if (hasOp) {
        formulaEl.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷');
        amountEl.textContent = evalVal.toLocaleString();
      } else {
        formulaEl.textContent = '';
        amountEl.textContent = parseFloat(expr || 0).toLocaleString();
      }

      document.getElementById('card-display-amount').textContent = evalVal.toLocaleString();
    }

    function confirmCalculatorAmount() {
      updateCalculatorSheetDisplay();
      closeCalculatorSheet();
    }

    /**
     * Submit Transaction (Expense / Income / Transfer)
     */
    async function submitTransaction() {
      const finalAmount = evaluateExpression(state.calcExpression);

      if (finalAmount <= 0) {
        showToast('金額必須大於 0', 'error');
        openCalculatorSheet();
        return;
      }

      const noteText = document.getElementById('input-note').value.trim();

      if (state.currentType === 'transfer') {
        if (!state.selectedAccount || !state.transferTargetAccount) {
          showToast('請選取轉出與轉入帳戶', 'error');
          return;
        }
        if (state.selectedAccount.id === state.transferTargetAccount.id) {
          showToast('轉出與轉入帳戶不可相同', 'error');
          return;
        }

        const newTransferRecord = {
          type: 'transfer',
          amount: finalAmount,
          parentCategoryId: null,
          subCategoryId: null,
          accountId: state.selectedAccount.id,
          targetAccountId: state.transferTargetAccount.id,
          date: state.selectedDate,
          note: noteText,
          recurringId: null,
          createdAt: Date.now()
        };

        try {
          await db.records.add(newTransferRecord);
          showToast(`已成功轉帳 NT$ ${finalAmount.toLocaleString()}`, 'success');
          resetTransactionForm();
          await renderWeekStripCalendar();
          await renderTodayRecords();
        } catch (err) {
          console.error(err);
          showToast('轉帳失敗，請重試', 'error');
        }

      } else {
        if (!state.selectedParentCategory) {
          showToast('請選取主分類', 'error');
          return;
        }
        if (!state.selectedAccount) {
          showToast('請選取帳戶', 'error');
          return;
        }

        const newRecord = {
          type: state.currentType,
          amount: finalAmount,
          parentCategoryId: state.selectedParentCategory.id,
          subCategoryId: state.selectedSubCategory ? state.selectedSubCategory.id : null,
          accountId: state.selectedAccount.id,
          targetAccountId: null,
          date: state.selectedDate,
          note: noteText,
          recurringId: null,
          createdAt: Date.now()
        };

        try {
          await db.records.add(newRecord);
          showToast(`已記錄 NT$ ${finalAmount.toLocaleString()}`, 'success');
          resetTransactionForm();
          await renderWeekStripCalendar();
          await renderTodayRecords();
        } catch (err) {
          console.error(err);
          showToast('儲存失敗，請重試', 'error');
        }
      }
    }

      state.calcExpression = '0';
      document.getElementById('input-note').value = '';

    }

    /**

    async function openEditRecordModal(recordId) {
      const rec = await db.records.get(recordId);
      if (!rec) return;

      document.getElementById('edit-record-id').value = rec.id;
      document.getElementById('edit-record-amount').value = rec.amount;
      document.getElementById('edit-record-date').value = rec.date;
      document.getElementById('edit-record-note').value = rec.note || '';

      switchEditRecordType(rec.type, false);

      // Populate Account options
      const accSelect = document.getElementById('edit-record-account');
      const fromAccSelect = document.getElementById('edit-record-from-account');
      const toAccSelect = document.getElementById('edit-record-to-account');

      const accOptions = state.allAccounts.map(a => `<option value="${a.id}">${a.name} (${a.groupName})</option>`).join('');
      accSelect.innerHTML = accOptions;
      fromAccSelect.innerHTML = accOptions;
      toAccSelect.innerHTML = accOptions;

      if (rec.type === 'transfer') {
        fromAccSelect.value = rec.accountId;
        toAccSelect.value = rec.targetAccountId;
      } else {
        accSelect.value = rec.accountId;

        // Populate Category Options
        const parentSelect = document.getElementById('edit-record-parent-cat');
        const validCats = state.allCategories.filter(c => c.type === rec.type && c.parentId === null);
        parentSelect.innerHTML = validCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        parentSelect.value = rec.parentCategoryId;

        onEditParentCatChanged(rec.parentCategoryId, rec.subCategoryId);
      }

      document.getElementById('edit-record-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function switchEditRecordType(type, resetCats = true) {
      state.editRecordType = type;
      const expTab = document.getElementById('edit-tab-expense');
      const incTab = document.getElementById('edit-tab-income');
      const traTab = document.getElementById('edit-tab-transfer');
      const stdFields = document.getElementById('edit-fields-standard');
      const traFields = document.getElementById('edit-fields-transfer');

      expTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
      incTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
      traTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';

      if (type === 'expense') {
        expTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950';
        stdFields.classList.remove('hidden');
        traFields.classList.add('hidden');
      } else if (type === 'income') {
        incTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-emerald-500 text-zinc-950';
        stdFields.classList.remove('hidden');
        traFields.classList.add('hidden');
      } else if (type === 'transfer') {
        traTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-blue-500 text-zinc-950';
        stdFields.classList.add('hidden');
        traFields.classList.remove('hidden');
      }

      if (resetCats && (type === 'expense' || type === 'income')) {
        const parentSelect = document.getElementById('edit-record-parent-cat');
        const validCats = state.allCategories.filter(c => c.type === type && c.parentId === null);
        parentSelect.innerHTML = validCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        if (validCats.length > 0) {
          parentSelect.value = validCats[0].id;
          onEditParentCatChanged(validCats[0].id);
        }
      }
    }

    function onEditParentCatChanged(parentId, targetSubCatId = null) {
      const subSelect = document.getElementById('edit-record-sub-cat');
      const pId = parseInt(parentId, 10);
      const subCats = state.allCategories.filter(c => c.parentId === pId);

      let opts = '<option value="">無子分類</option>';
      for (const sub of subCats) {
        opts += `<option value="${sub.id}">${sub.name}</option>`;
      }
      subSelect.innerHTML = opts;
      if (targetSubCatId) {
        subSelect.value = targetSubCatId;
      }
    }

      document.getElementById('edit-record-modal').classList.add('hidden');
    }

    async function saveEditRecord() {
      const recIdStr = document.getElementById('edit-record-id').value;
      const recId = parseInt(recIdStr, 10);
      const amount = parseFloat(document.getElementById('edit-record-amount').value);
      const date = document.getElementById('edit-record-date').value;
      const note = document.getElementById('edit-record-note').value.trim();

      if (isNaN(amount) || amount <= 0) {
        showToast('金額必須大於 0', 'error');
        return;
      }
      if (!date) {
        showToast('請選取日期', 'error');
        return;
      }

      if (state.editRecordType === 'transfer') {
        const fromAccId = parseInt(document.getElementById('edit-record-from-account').value, 10);
        const toAccId = parseInt(document.getElementById('edit-record-to-account').value, 10);

        if (fromAccId === toAccId) {
          showToast('轉出與轉入帳戶不可相同', 'error');
          return;
        }

        await db.records.update(recId, {
          type: 'transfer',
          amount: amount,
          date: date,
          accountId: fromAccId,
          targetAccountId: toAccId,
          parentCategoryId: null,
          subCategoryId: null,
          note: note
        });
      } else {
        const accId = parseInt(document.getElementById('edit-record-account').value, 10);
        const parentCatId = parseInt(document.getElementById('edit-record-parent-cat').value, 10);
        const subCatVal = document.getElementById('edit-record-sub-cat').value;
        const subCatId = subCatVal ? parseInt(subCatVal, 10) : null;

        if (!parentCatId) {
          showToast('請選取主分類', 'error');
          return;
        }

        await db.records.update(recId, {
          type: state.editRecordType,
          amount: amount,
          date: date,
          accountId: accId,
          targetAccountId: null,
          parentCategoryId: parentCatId,
          subCategoryId: subCatId,
          note: note
        });
      }

      showToast('流水帳已成功更新', 'success');
      closeEditRecordModal();
      await renderWeekStripCalendar();
      await renderTodayRecords();
    }

    }

    async function toggleArchiveAccount(accId) {
      const acc = state.allAccounts.find(a => a.id === accId);
      if (!acc) return;
      
      const willArchive = !acc.isArchived;
      if (willArchive && acc.isDefault) {
        showToast('預設帳戶不可直接封存', 'error');
        return;
      }

      await db.accounts.update(accId, { isArchived: willArchive });
      await loadAllData();
      showToast(willArchive ? '已封存該帳戶' : '已解封該帳戶', 'success');
      await openAccountManageModal();
    }

    function openNewAccountForm() {
      document.getElementById('form-account-id').value = '';
      document.getElementById('form-account-title').textContent = '新增帳戶';
      document.getElementById('form-account-group').value = '現金';
      document.getElementById('form-account-name').value = '';
      document.getElementById('form-account-balance').value = '0';
      
      const radios = document.querySelectorAll('input[name="acc-icon"]');
      radios.forEach((r, idx) => {
        r.checked = (idx === 0);
      });

      document.getElementById('account-form-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function openEditAccountForm(accId) {
      const acc = state.allAccounts.find(a => a.id == accId);
      if (!acc) return;

      document.getElementById('form-account-id').value = acc.id;
      document.getElementById('form-account-title').textContent = `編輯帳戶 - ${acc.name}`;
      document.getElementById('form-account-group').value = acc.groupName;
      document.getElementById('form-account-name').value = acc.name;
      document.getElementById('form-account-balance').value = acc.initialBalance !== undefined ? acc.initialBalance : 0;

      const radios = document.querySelectorAll('input[name="acc-icon"]');
      radios.forEach(r => {
        r.checked = (r.value === acc.icon);
      });

      document.getElementById('account-form-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeAccountFormModal() {
      document.getElementById('account-form-modal').classList.add('hidden');
    }

    async function saveAccountForm() {
      const accIdStr = document.getElementById('form-account-id').value;
      const name = document.getElementById('form-account-name').value.trim();
      const groupName = document.getElementById('form-account-group').value;
      const bal = parseFloat(document.getElementById('form-account-balance').value) || 0;
      const icon = document.querySelector('input[name="acc-icon"]:checked')?.value || 'asset/account-dollar.svg';

      if (!name) {
        showToast('請輸入帳戶名稱', 'error');
        return;
      }

      if (accIdStr) {
        const accId = parseInt(accIdStr, 10);
        await db.accounts.update(accId, {
          name,
          groupName,
          icon,
          initialBalance: bal
        });
        showToast(`已成功修改帳戶「${name}」與初始值`, 'success');
      } else {
        await db.accounts.add({
          name,
          groupName,
          icon,
          initialBalance: bal,
          isDefault: false,
          isArchived: false
        });
        showToast(`已成功新增帳戶「${name}」`, 'success');
      }

      await loadAllData();
      if (state.selectedAccount && state.selectedAccount.id == accIdStr) {
        const updated = state.allAccounts.find(a => a.id == accIdStr);
        if (updated) setSelectedAccount(updated);
      }
      closeAccountFormModal();
      await openAccountManageModal();
    }

    /**
     * Category Management Modal
     */
    function openCategoryManageModal() {
      renderCategoryManageList();
      document.getElementById('category-manage-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeCategoryManageModal() {
      document.getElementById('category-manage-modal').classList.add('hidden');
    }

    function switchCategoryManageType(type) {
      state.categoryManageType = type;
      const expTab = document.getElementById('cat-manage-tab-exp');
      const incTab = document.getElementById('cat-manage-tab-inc');

      if (type === 'expense') {
        expTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950';
        incTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
      } else {
        incTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-emerald-500 text-zinc-950';
        expTab.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
      }
      renderCategoryManageList();
    }

    function renderCategoryManageList() {
      const listEl = document.getElementById('manage-category-list');
      const parents = state.allCategories.filter(
        c => c.type === state.categoryManageType && c.parentId === null
      );

      listEl.innerHTML = parents.map(p => {
        const subs = state.allCategories.filter(c => c.parentId === p.id);

        return `
          <div class="bg-zinc-900 rounded-2xl p-3 border border-zinc-800 ${p.isArchived ? 'opacity-50' : ''}">
            <div class="flex items-center justify-between pb-2 border-b border-zinc-800">
              <div class="flex items-center gap-2">
                <img src="${p.icon}" class="w-5 h-5 object-contain">
                <span class="text-xs font-bold text-zinc-200">${p.name}</span>
                ${p.isArchived ? '<span class="text-[9px] px-1 bg-zinc-700 text-zinc-400 rounded">已封存</span>' : ''}
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="openEditCategoryForm(${p.id})" class="text-[10px] px-2 py-1 rounded bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-semibold">
                  編輯
                </button>
                <button onclick="openNewCategoryForm(${p.id})" class="text-[10px] px-2 py-1 rounded bg-amber-500/20 text-amber-300 font-bold hover:bg-amber-500/30">
                  + 子分類
                </button>
                <button onclick="toggleArchiveCategory(${p.id})" class="text-[10px] px-2 py-1 rounded bg-zinc-800 text-zinc-400 hover:bg-zinc-700">
                  ${p.isArchived ? '解封' : '封存'}
                </button>
              </div>
            </div>

            <div class="pt-2 flex flex-wrap gap-1.5">
              ${subs.length > 0 ? subs.map(s => `
                <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-zinc-800 border border-zinc-700/60 text-[11px] text-zinc-300 ${s.isArchived ? 'opacity-50' : ''}">
                  <img src="${s.icon}" class="w-3.5 h-3.5 object-contain">
                  <span>${s.name}</span>
                  <button onclick="openEditCategoryForm(${s.id})" title="編輯" class="text-zinc-400 hover:text-amber-300 ml-0.5">
                    <i data-lucide="edit-3" class="w-3 h-3"></i>
                  </button>
                  <button onclick="toggleArchiveCategory(${s.id})" title="${s.isArchived ? '解封' : '封存'}" class="text-zinc-500 hover:text-red-400 ml-0.5">
                    <i data-lucide="${s.isArchived ? 'rotate-ccw' : 'x'}" class="w-3 h-3"></i>
                  </button>
                </div>
              `).join('') : '<span class="text-[10px] text-zinc-500">尚無子分類</span>'}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    async function toggleArchiveCategory(catId) {
      const cat = state.allCategories.find(c => c.id === catId);
      if (!cat) return;

      const willArchive = !cat.isArchived;
      await db.categories.update(catId, { isArchived: willArchive });
      await loadAllData();
      showToast(willArchive ? '已封存分類' : '已解封分類', 'success');
      renderCategoryManageList();
      renderSubCategoryQuickPills();
    }

    function switchCategoryFormLevel(level) {
      state.categoryFormLevel = level;
      const pBtn = document.getElementById('form-level-parent');
      const sBtn = document.getElementById('form-level-sub');
      const parentSelectWrap = document.getElementById('form-cat-parent-select-wrap');

      if (level === 'parent') {
        pBtn.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950';
        sBtn.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
        parentSelectWrap.classList.add('hidden');
      } else {
        sBtn.className = 'flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-zinc-950';
        pBtn.className = 'flex-1 py-1 rounded-lg text-xs font-bold text-zinc-400';
        parentSelectWrap.classList.remove('hidden');
      }
    }

    function populateParentCategorySelect(selectedParentId = null) {
      const selectEl = document.getElementById('form-cat-parent-id');
      const parents = state.allCategories.filter(
        c => c.type === state.categoryManageType && c.parentId === null && !c.isArchived
      );

      selectEl.innerHTML = parents.map(p => `
        <option value="${p.id}">${p.name}</option>
      `).join('');

      if (selectedParentId) {
        selectEl.value = selectedParentId;
      } else if (parents.length > 0) {
        selectEl.value = parents[0].id;
      }
    }

    function openNewCategoryForm(parentId = null) {
      document.getElementById('form-cat-id').value = '';
      document.getElementById('form-cat-name').value = '';
      populateParentCategorySelect(parentId);

      if (parentId) {
        document.getElementById('category-form-title').textContent = '新增子分類';
        switchCategoryFormLevel('sub');
      } else {
        document.getElementById('category-form-title').textContent = '新增分類';
        switchCategoryFormLevel('parent');
      }

      const iconGrid = document.getElementById('form-cat-icon-grid');
      iconGrid.innerHTML = AVAILABLE_ICONS.map((icon, idx) => `
        <label class="flex items-center justify-center p-2 rounded-lg bg-zinc-800 border border-zinc-700 hover:border-amber-400 cursor-pointer">
          <input type="radio" name="cat-icon-choice" value="${icon}" class="hidden" ${idx === 0 ? 'checked' : ''}>
          <img src="${icon}" class="w-5 h-5 object-contain">
        </label>
      `).join('');

      document.getElementById('category-form-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function openEditCategoryForm(catId) {
      const cat = state.allCategories.find(c => c.id == catId);
      if (!cat) return;

      document.getElementById('form-cat-id').value = cat.id;
      document.getElementById('form-cat-name').value = cat.name;
      populateParentCategorySelect(cat.parentId);

      if (cat.parentId !== null) {
        document.getElementById('category-form-title').textContent = `編輯子分類 - ${cat.name}`;
        switchCategoryFormLevel('sub');
      } else {
        document.getElementById('category-form-title').textContent = `編輯主分類 - ${cat.name}`;
        switchCategoryFormLevel('parent');
      }

      const iconGrid = document.getElementById('form-cat-icon-grid');
      iconGrid.innerHTML = AVAILABLE_ICONS.map((icon) => `
        <label class="flex items-center justify-center p-2 rounded-lg bg-zinc-800 border border-zinc-700 hover:border-amber-400 cursor-pointer">
          <input type="radio" name="cat-icon-choice" value="${icon}" class="hidden" ${icon === cat.icon ? 'checked' : ''}>
          <img src="${icon}" class="w-5 h-5 object-contain">
        </label>
      `).join('');

      document.getElementById('category-form-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeCategoryFormModal() {
      document.getElementById('category-form-modal').classList.add('hidden');
    }

    async function saveCategoryForm() {
      const catIdStr = document.getElementById('form-cat-id').value;
      const name = document.getElementById('form-cat-name').value.trim();
      const isSub = (state.categoryFormLevel === 'sub');
      const parentSelectVal = document.getElementById('form-cat-parent-id').value;
      const parentId = isSub && parentSelectVal ? parseInt(parentSelectVal, 10) : null;
      const icon = document.querySelector('input[name="cat-icon-choice"]:checked')?.value || 'asset/categories-money.svg';

      if (!name) {
        showToast('請輸入分類名稱', 'error');
        return;
      }

      if (isSub && !parentId) {
        showToast('請先建立主分類才能新增子分類', 'error');
        return;
      }

      if (catIdStr) {
        const catId = parseInt(catIdStr, 10);
        await db.categories.update(catId, {
          name,
          parentId,
          icon
        });
        showToast(`已成功修改分類「${name}」`, 'success');
      } else {
        await db.categories.add({
          name,
          type: state.categoryManageType,
          parentId: parentId,
          icon: icon,
          color: '#f59e0b',
          budgetMonthly: 0,
          isArchived: false
        });
        showToast(`已成功新增「${name}」`, 'success');
      }

      await loadAllData();
      closeCategoryFormModal();
      renderCategoryManageList();
      renderSubCategoryQuickPills();
    }

    /**
     * Delete Confirmation Modal
     */
    let pendingDeleteId = null;
    function confirmDeleteRecord(id) {
      pendingDeleteId = id;
      document.getElementById('confirm-modal').classList.remove('hidden');
      document.getElementById('btn-confirm-delete').onclick = async () => {
        if (pendingDeleteId) {
          await db.records.delete(pendingDeleteId);
          showToast('已刪除紀錄', 'success');
          closeConfirmModal();
          await renderWeekStripCalendar();
          await renderTodayRecords();
        }
      };
      lucide.createIcons();
    }

    function closeConfirmModal() {
      pendingDeleteId = null;
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    /**
     * Reports Modal & Chart.js Integration
     */
    async function openReportsModal() {
      const allRecords = await db.records.toArray();
      const now = new Date();
      const curYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      let monthExp = 0;
      let monthInc = 0;
      const catExpenseMap = {};

      for (const rec of allRecords) {
        if (rec.date && rec.date.startsWith(curYearMonth)) {
          if (rec.type === 'expense') {
            monthExp += rec.amount;
            const parentCat = state.allCategories.find(c => c.id === rec.parentCategoryId);
            const name = parentCat?.name || '其他';
            catExpenseMap[name] = (catExpenseMap[name] || 0) + rec.amount;
          } else if (rec.type === 'income') {
            monthInc += rec.amount;
          }
        }
      }

      document.getElementById('stat-month-expense').textContent = `NT$ ${monthExp.toLocaleString()}`;
      document.getElementById('stat-month-income').textContent = `NT$ ${monthInc.toLocaleString()}`;
      document.getElementById('stat-month-balance').textContent = `NT$ ${(monthInc - monthExp).toLocaleString()}`;

      const ctx = document.getElementById('categoryExpenseChart').getContext('2d');
      if (state.chartInstance) state.chartInstance.destroy();

      const labels = Object.keys(catExpenseMap);
      const data = Object.values(catExpenseMap);

      if (labels.length === 0) {
        labels.push('尚無支出');
        data.push(1);
      }

      state.chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#eab308']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10 } } }
          }
        }
      });

      document.getElementById('reports-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeReportsModal() {
      document.getElementById('reports-modal').classList.add('hidden');
    }

    /**
     * Backup & Export Modal
     */
    function openBackupModal() {
      document.getElementById('backup-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeBackupModal() {
      document.getElementById('backup-modal').classList.add('hidden');
    }

    async function exportJSONBackup() {
      const data = {
        schemaVersion: 1,
        exportedAt: new Date().toISOString(),
        categories: await db.categories.toArray(),
        accounts: await db.accounts.toArray(),
        records: await db.records.toArray(),
        recurring: await db.recurring.toArray()
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `PocketLedger_Backup_${getTodayString()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('備份檔案已成功下載', 'success');
    }

    async function importJSONBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const json = JSON.parse(e.target.result);
          if (!json.categories || !json.accounts || !json.records) {
            showToast('備份檔案格式不正確', 'error');
            return;
          }

          await db.transaction('rw', db.categories, db.accounts, db.records, db.recurring, async () => {
            await db.categories.clear();
            await db.accounts.clear();
            await db.records.clear();
            await db.recurring.clear();

            await db.categories.bulkAdd(json.categories);
            await db.accounts.bulkAdd(json.accounts);
            await db.records.bulkAdd(json.records);
            if (json.recurring) await db.recurring.bulkAdd(json.recurring);
          });

          await loadAllData();
          await renderWeekStripCalendar();
          renderSubCategoryQuickPills();
          await renderTodayRecords();
          showToast('資料庫已成功還原！', 'success');
          closeBackupModal();
        } catch (err) {
          console.error(err);
          showToast('匯入失敗，檔案損壞', 'error');
        }
      };
      reader.readAsText(file);
    }

    function switchView(view) {
      // Home view handler
    }

    /**
     * Toast System
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const iconName = type === 'error' ? 'alert-circle' : (type === 'success' ? 'check-circle-2' : 'info');
      const borderClass = type === 'error' ? 'border-red-500/50 bg-red-950/90 text-red-200' : (type === 'success' ? 'border-emerald-500/50 bg-zinc-900/95 text-emerald-300' : 'border-zinc-700 bg-zinc-800 text-zinc-200');

      toast.className = `flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-medium border shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-[-10px] opacity-0 ${borderClass}`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-4 h-4 flex-shrink-0"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration error:', err);
        });
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
